<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25272D"/>
      <stop offset="1" stop-color="#17181C"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#CDEBF7"/>
      <stop offset="0.55" stop-color="#A9CBEB"/>
      <stop offset="1" stop-color="#7FC4E3"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A64A6"/>
      <stop offset="1" stop-color="#1B2A6B"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#A9CBEB" fill-opacity="0.16"/>
    </pattern>
    <pattern id="stripes" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="5" height="14" fill="#F3B9C9" fill-opacity="0.55"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="300" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>

    <!-- 점 패턴 -->
    <rect x="560" y="0" width="640" height="300" fill="url(#dots)"/>

    <!-- 도형 구성 -->
    <circle cx="1010" cy="150" r="128" fill="url(#navy)"/>
    <circle cx="1010" cy="150" r="128" fill="none" stroke="#1B2A6B" stroke-width="6"/>
    <circle cx="880" cy="214" r="70" fill="none" stroke="#A9CBEB" stroke-width="10" stroke-opacity="0.9"/>
    <path d="M1080 0 A 92 92 0 0 0 1172 92 L 1172 0 Z" fill="#F3B9C9" fill-opacity="0.85"/>
    <circle cx="1118" cy="236" r="44" fill="url(#stripes)"/>
    <circle cx="1118" cy="236" r="44" fill="none" stroke="#F3B9C9" stroke-width="3" stroke-opacity="0.7"/>
    <circle cx="930" cy="70" r="18" fill="#7FC4E3"/>
    <circle cx="968" cy="112" r="7" fill="#CDEBF7"/>
    <rect x="770" y="58" width="56" height="56" rx="14" fill="none" stroke="#7FC4E3" stroke-width="5" transform="rotate(18 798 86)"/>
    <path d="M700 252 l26 -36 l26 36 Z" fill="#2E5490" stroke="#A9CBEB" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <text x="80" y="170" font-family="'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="104" font-weight="800" fill="url(#name)" letter-spacing="-2">doasi</text>
  <rect x="86" y="196" width="72" height="8" rx="4" fill="#F3B9C9"/>
  <rect x="166" y="196" width="36" height="8" rx="4" fill="#7FC4E3"/>
  <rect x="210" y="196" width="18" height="8" rx="4" fill="#2E5490"/>
</svg>
